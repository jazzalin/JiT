seed_everything: 21

model:
  weather_dropout: True
  initial_dropout: True
  ref_dropout: True
  sample_steps: 20
  weather_channels: 55
  weather_encoder_cnn: false
  viewshed_radius: 8000
  cond_channels: 2048
  latent_dim: 64
  model: "unet"
  channel_multipliers:
    - 1
    - 2
    - 2
    - 4

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-4

trainer:
  accelerator: gpu
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        enable_version_counter: false
        filename: '{epoch:02d}'
        every_n_epochs: 5
        save_on_exception: true
        save_top_k: -1
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: photocast.utils.ema.PowerWeightAveraging
      init_args:
        std1: 0.05
        std2: 0.1
  devices:
  - 0
  enable_progress_bar: true
  limit_train_batches: 16384
  limit_val_batches: 16
  log_every_n_steps: 250
  logger:
    class_path: pytorch_lightning.loggers.WandbLogger
    init_args:
      name: demo
      save_dir: ./runs/wandb/photocast
      version: null
  max_epochs: 20
  precision: bf16-mixed

data:
  lead_times: 
    - 120
    - 120
  # images kept for training/evaluation, [start, end] inclusive (the weather for 2024-12-29 is broken)
  date_ranges:
    - ['2024-01-01 00:00:00', '2024-12-28 23:59:59']
    - ['2025-01-01 00:00:00', '2025-12-31 23:59:59']
  batch_size: 4
  eval_size:
  - 128
  - 1024
  image_root_dir: ./data
  # train_crop:
  #   native:   native field of view of every camera at height img_size[0] and its own width (multiple of
  #             width_multiple, the patch size), batched by width, for cylindrical models
  #   panorama: full 360 deg panoramas resized to img_size (256 x 2048)
  #   random:   img_size crops at a random heading
  img_size:
  - 256
  - 2048
  train_crop: native
  width_multiple: 32
  num_workers: 40
  viewshed_radius: 8000
